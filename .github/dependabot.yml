version: 2
updates:
  # versions.Dockerfile: the Rocky 9 base digests.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    ignore:
      # EL10 is the x86-64-v3 baseline this repo exists to avoid.
      - dependency-name: "*rockylinux/rockylinux"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
